services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 15

  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Read by config/database.yml
      DB_HOST: db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      RAILS_ENV: development
    volumes:
      # Mount the code so changes show up without rebuilding the image
      - .:/rails
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true

volumes:
  postgres_data:
